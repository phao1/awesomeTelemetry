<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AwesomeTelemetry</title>
    <script>
      // G-DS-2 / REQ-001 Scenario：内联同步主题脚本，必须早于任何 CSS 应用。
      // 持久化键 awesome-telemetry.theme（dark | light | system，默认 system）。
      // 兼容回退（B6，§8）：读不到新键则读旧键 agent-observability.theme，
      // 读到就顺手写一份新键 —— 老用户主题不丢，不闪白。
      (function () {
        try {
          var stored = localStorage.getItem('awesome-telemetry.theme');
          if (stored === null) {
            var legacy = localStorage.getItem('agent-observability.theme');
            if (legacy !== null) {
              stored = legacy;
              try {
                localStorage.setItem('awesome-telemetry.theme', legacy);
              } catch (err) {
                // 回写失败不影响本次渲染（隐私模式等）
                void err;
              }
            }
          }
          var effective;
          if (stored === 'dark' || stored === 'light') {
            effective = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            effective = 'light';
          } else {
            effective = 'dark'; // 无偏好时按 dark（契约 §1）
          }
          document.documentElement.setAttribute('data-theme', effective);
        } catch (err) {
          // localStorage 在部分隐私模式下抛错：兜底 dark 并记录，避免闪白与静默
          document.documentElement.setAttribute('data-theme', 'dark');
          console.error('[theme] 初始化失败:', err);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
