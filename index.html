<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Observability</title>
    <script>
      // G-DS-2 / REQ-001 Scenario：内联同步主题脚本，必须早于任何 CSS 应用。
      // 持久化键 agent-observability.theme（dark | light | system，默认 system）。
      (function () {
        try {
          var stored = localStorage.getItem('agent-observability.theme');
          var effective;
          if (stored === 'dark' || stored === 'light') {
            effective = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            effective = 'light';
          } else {
            effective = 'dark'; // 无偏好时按 dark（契约 §1）
          }
          document.documentElement.setAttribute('data-theme', effective);
        } catch (err) {
          // localStorage 在部分隐私模式下抛错：兜底 dark 并记录，避免闪白与静默
          document.documentElement.setAttribute('data-theme', 'dark');
          console.error('[theme] 初始化失败:', err);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
